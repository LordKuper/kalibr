apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: kalibr
data:
  # Must equal the mountPath of the app-keys volume in app.yaml.
  DataProtection__KeysPath: /var/lib/kalibr/keys
  # Where TLS ends is not decided yet. Switch to Always once it ends in front of the app,
  # otherwise the session cookie is issued without the Secure flag.
  Authentication__Cookie__SecurePolicy: SameAsRequest
  # Files in the image never change at runtime, and every config watcher spends one instance
  # of the node-wide inotify limit.
  DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: "false"
  # Address users open the application at; every link in an e-mail starts with it. The app does not start without
  # an absolute http(s) URL here.
  App__PublicBaseUrl: "<PUBLIC_BASE_URL>"
  # Corporate SMTP relay. Credentials, when the relay needs them, go to the Secret (Smtp__UserName, Smtp__Password).
  Smtp__Host: "<SMTP_HOST>"
  Smtp__Port: "587"
  # None, Auto, SslOnConnect (port 465), StartTls (port 587) or StartTlsWhenAvailable. None sends mail unencrypted.
  Smtp__SecureSocketOptions: StartTls
  # Sender mailbox, optionally "Name <address>".
  Smtp__From: "<SMTP_FROM>"
  # Upper bound for one send; an administrator's request waits for it.
  Smtp__Timeout: "00:00:15"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: kalibr
data:
  # Cluster superuser, for maintenance only: the app never connects with it (its password is POSTGRES_PASSWORD of the Secret).
  POSTGRES_USER: postgres
  # Must match Database in ConnectionStrings__Default of the Secret and the database name in db-init.
  POSTGRES_DB: kalibr
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: kalibr
data:
  # Runs once, on the first start of an empty data volume: creates the role the app connects with and makes it the owner of
  # the database. Role name must match Username in ConnectionStrings__Default of the Secret. The password reaches psql as a
  # variable, so it is quoted by psql; the heredoc is quoted so that the shell leaves :'app_password' alone.
  10-app-role.sh: |
    #!/bin/sh
    psql -v ON_ERROR_STOP=1 -v app_password="$KALIBR_DB_PASSWORD" --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<'SQL'
    CREATE ROLE kalibr LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD :'app_password';
    ALTER DATABASE kalibr OWNER TO kalibr;
    SQL
