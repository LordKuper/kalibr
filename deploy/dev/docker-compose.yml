name: kalibr-dev

services:
  db:
    image: postgres:18.6-trixie
    environment:
      # Superuser for maintenance; the app connects as the role kalibr that db-init.sh creates.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_pass_123
      KALIBR_DB_PASSWORD: dev_pass_123
      POSTGRES_DB: kalibr
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kalibr -d kalibr"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.4
    environment:
      MP_ALLOWED_HOSTS: localhost
      # Без этого приветствие SMTP приходит через 8-10 с из-за обратного DNS на Docker Desktop.
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "127.0.0.1:${DEV_MAIL_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${DEV_MAIL_UI_PORT:-18025}:8025"

volumes:
  pgdata:
    name: kalibr-dev-pgdata
